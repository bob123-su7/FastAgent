[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastagent"
version = "0.1.0"
description = "FastAgent：面向学习的 AI Agent 基础框架"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["fastagent", "fastagent_eval", "fastagent_trace"]
