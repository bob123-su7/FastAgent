name: 功能建议
description: 提议一个对 FastAgent 学习或实践有帮助的改进
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议。请尽量说明要解决的问题，而不只是描述期望的实现方式。

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issue 和 Pull Request，确认没有相同建议。
          required: true
        - label: 该建议与 FastAgent 的学习或实践目标相关。
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 背景与问题
      description: 当前遇到了什么困难？哪些使用者会受到影响？
      placeholder: 描述真实的使用场景和问题。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 请说明你希望如何改进，并给出一个尽可能小的可交付范围。
      placeholder: 描述建议的行为、文档或示例。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你是否尝试过其他方法？为什么它们没有解决问题？
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: 验收方式
      description: 如何判断这项改进已经完成并且有效？
      placeholder: 例如：新增示例可以离线运行，并展示预期输出。
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 可以添加相关链接、截图或其他上下文。
    validations:
      required: false
