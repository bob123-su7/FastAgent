name: Bug 报告
description: 报告可复现的问题，帮助我们定位并修复缺陷
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        感谢你帮助改进 FastAgent。提交前请先搜索现有 Issue，避免重复反馈。

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issue，确认没有相同问题。
          required: true
        - label: 我已使用仓库最新的 `main` 分支复现该问题。
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 请说明发生了什么，以及它对你的使用造成了什么影响。
      placeholder: 清晰、简洁地描述问题。
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 请提供能够稳定复现问题的最小步骤。
      placeholder: |
        1. 执行……
        2. 配置……
        3. 观察到……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 请说明你原本期望发生什么。
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 请填写与问题有关的环境信息。
      value: |
        - 操作系统：
        - Python 版本：
        - 使用的工具或终端：
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志与补充信息
      description: 可粘贴相关日志，或拖入截图和其他有助于定位问题的文件。请先移除敏感信息。
      render: shell
    validations:
      required: false
